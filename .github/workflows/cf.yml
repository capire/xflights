name: Cloud Foundry

on:
  workflow_call:
    inputs:
      environment:
        default: Staging
        type: string
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

env:
  APP_NAME: xflights

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: cap-js/cf-setup@v2
        with:
          api: ${{ vars.CF_API }}
          org: ${{ vars.CF_ORG }}
          space: ${{ vars.CF_SPACE }}
          username: ${{ vars.CF_USERNAME }}
          password: ${{ secrets.CF_PASSWORD }}
      - run: npm set @capire:registry https://npm.pkg.github.com/
        shell: bash
      - run: npm set //npm.pkg.github.com/:_authToken=${{ secrets.CAPIRE_READ_PACKAGES }}
        shell: bash
      - run: npm add -g @sap/cds-dk
      - run: cds add xsuaa
      - run: cds up

      - run: cf logs ${{ env.APP_NAME }}-srv --recent
        if: always()
      - run: cf logs ${{ env.APP_NAME }}-db-deployer --recent
        if: always()
    environment:
      name: ${{ inputs.environment || 'Staging' }}
